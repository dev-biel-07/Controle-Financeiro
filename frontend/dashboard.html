<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle Financeiro — Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">💰 Controle Financeiro</div>
    <button class="btn btn-secondary" onclick="logout()">Sair</button>
  </header>

  <main class="app-main">
    <!-- Cards de resumo -->
    <section class="summary-grid">
      <div class="summary-card total">
        <div class="label">Total gasto</div>
        <div class="value" id="summary-total">R$ 0,00</div>
      </div>
      <div class="summary-card">
        <div class="label">Nº de gastos</div>
        <div class="value" id="summary-count">0</div>
      </div>
      <div class="summary-card">
        <div class="label">Categorias</div>
        <div class="value" id="summary-categories">0</div>
      </div>
    </section>

    <div class="content-grid">
      <!-- Coluna esquerda: lista de gastos + formulário -->
      <div>
        <div class="panel">
          <div class="panel-header">
            <h2>Novo gasto</h2>
          </div>
          <form id="expense-form">
            <div class="form-group">
              <label for="expense-description">Descrição</label>
              <input type="text" id="expense-description" required placeholder="Ex: Mercado, Uber, Aluguel..." />
            </div>
            <div class="form-group">
              <label for="expense-amount">Valor (R$)</label>
              <input type="number" id="expense-amount" step="0.01" min="0.01" required placeholder="0,00" />
            </div>
            <div class="form-group">
              <label for="expense-category">Categoria (opcional)</label>
              <select id="expense-category">
                <option value="">Sem categoria</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Adicionar gasto</button>
          </form>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>Últimos gastos</h2>
          </div>
          <ul class="expense-list" id="expense-list">
            <li class="empty-state">Carregando...</li>
          </ul>
        </div>
      </div>

      <!-- Coluna direita: gráfico + categorias -->
      <div>
        <div class="panel">
          <div class="panel-header">
            <h2>Gastos por categoria</h2>
          </div>
          <canvas id="category-chart" height="220"></canvas>
          <div class="empty-state hidden" id="chart-empty">Nenhum gasto ainda.</div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>Categorias</h2>
          </div>
          <div class="category-chip-list" id="category-chip-list"></div>
          <form id="category-form" class="inline-form">
            <input type="text" id="category-name" required placeholder="Nova categoria (ex: Lazer)" />
            <button type="submit" class="btn btn-primary">+</button>
          </form>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
