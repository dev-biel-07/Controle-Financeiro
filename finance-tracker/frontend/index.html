<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle Financeiro — Entrar</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="emoji">💰</div>
        <h1>Controle Financeiro</h1>
      </div>

      <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Entrar</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Cadastrar</button>
      </div>

      <!-- Formulário de login -->
      <form id="login-form">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="voce@email.com" />
        </div>
        <div class="form-group">
          <label for="login-password">Senha</label>
          <input type="password" id="login-password" required placeholder="••••••••" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
        <div class="error-msg" id="login-error"></div>
      </form>

      <!-- Formulário de cadastro -->
      <form id="register-form" class="hidden">
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" required placeholder="voce@email.com" />
        </div>
        <div class="form-group">
          <label for="register-password">Senha</label>
          <input type="password" id="register-password" required minlength="6" placeholder="mínimo 6 caracteres" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Criar conta</button>
        <div class="error-msg" id="register-error"></div>
      </form>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
